spring:
  application:
    name: service-scheduler
  datasource:
    url: ${SCHEDULER_DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${SCHEDULER_DB_USERNAME:scheduler}
    password: ${SCHEDULER_DB_PASSWORD:scheduler}
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
