spring:
  application:
    name: service-scheduler
  datasource:
    url: ${SCHEDULER_DB_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${SCHEDULER_DB_USERNAME:scheduler}
    password: ${SCHEDULER_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${SCHEDULER_REDIS_HOST:localhost}
      port: ${SCHEDULER_REDIS_PORT:6380}
      connect-timeout: 100ms
      timeout: 100ms
  kafka:
    bootstrap-servers: ${SCHEDULER_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    admin:
      fail-fast: false
      operation-timeout: 3s
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 4000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

scheduler:
  cache:
    enabled: ${SCHEDULER_CACHE_ENABLED:true}
  events:
    enabled: ${SCHEDULER_EVENTS_ENABLED:true}
    topic: keyloop.ownership.appointments.v1
    poll-delay: 500

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: db
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

logging:
  structured:
    format:
      console: ecs
